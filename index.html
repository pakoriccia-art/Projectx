<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0806" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Gestione predittiva degli impasti della pizza" />

    <!-- Preconnect per font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <title>PizzaMatrix</title>

    <style>
      /* Reset base + variabili design system */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        /* Background tiers */
        --bg-primary:      #0a0806;
        --bg-base:         #0a0806;   /* alias --bg-primary, usato nelle action-bar */
        --bg-surface:      #141008;
        --bg-elevated:     #1e1810;

        --state-cold:           #74b9ff;
        --state-underfermented: #00b894;
        --state-approaching:    #55efc4;
        --state-optimal-lo:     #ffd166;
        --state-optimal-hi:     #ff8c32;
        --state-danger:         #e17055;
        --state-critical:       #ff7675;
        --state-collapsed:      #d63031;

        --accent-brand:   #ff8c32;
        --accent-warning: #ffd166;
        --accent-info:    #74b9ff;

        --pref-poolish:  #ffd166;
        --pref-biga:     #ff8c32;
        --pref-autolisi: #74b9ff;

        --text-primary:   #e8d5b0;
        --text-secondary: #a09070;
        --text-muted:     #5a4a30;
        --text-disabled:  #3a2a10;

        /* Layout */
        --padding-h: 18px;
        --padding-v: 22px;
        --radius-sm: 8px;
        --radius-md: 10px;
        --radius-lg: 14px;

        /* Font */
        --font-display: 'Fraunces', serif;
        --font-mono: 'JetBrains Mono', monospace;
        --font-body: -apple-system, 'Roboto', sans-serif;
      }

      html, body, #root {
        height: 100%;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-body);
        /* Safe area per notch iOS/Android */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      #root {
        max-width: 430px;
        margin: 0 auto;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
